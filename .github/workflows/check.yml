name: Preview checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-mcp.txt
      - run: python -m unittest discover -s watchroom -p "test_*.py"
        env:
          PYTHONUTF8: '1'
      - run: python tools/check_release.py
        env:
          PYTHONUTF8: '1'
