<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dandan Cinema</title><link rel="stylesheet" href="/style.css"><script src="/i18n.js" defer></script><script src="/app.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/"><img src="/brand/logo.png" width="62" height="62" alt="Dandan Cinema"><span data-zh="蛋蛋影院" data-en="Dandan Cinema">Dandan Cinema</span></a><p class="eyebrow">YOUR PERSONAL CINEMA</p><nav id="navigation"></nav><div class="sidebar-note"><p data-zh="好内容，慢慢看。" data-en="Good stories. In your own time."></p><small data-zh="片单与资料保存在这台电脑。" data-en="Your library stays on this computer."></small></div><button id="export" class="export" data-zh="↓ 导出片单" data-en="↓ Export library"></button><div class="profile"><span class="avatar">D</span><span data-zh="我的影院" data-en="My cinema"></span></div></aside>
<main><header class="topbar"><span class="breadcrumb" data-zh="我的空间 / 观看清单" data-en="My space / Watchlist"></span><label><span data-zh="语言 " data-en="Language "></span><select id="language" aria-label="Language / 语言"><option value="en">English</option><option value="zh">简体中文</option></select></label></header>
<section class="intro"><div><p class="eyebrow">A LITTLE SPACE FOR YOUR NEXT WATCH</p><h1 data-zh="想看的，都在这里。" data-en="Your next watch starts here."></h1><p class="intro-copy" data-zh="一个片名，一条链接。先收好，留给下一个电影之夜。" data-en="A title. A link. A little space for your next movie night."></p><button class="button primary" id="add-top" data-zh="＋ 收下一个想看" data-en="＋ Add to watchlist"></button></div><div class="feature" id="feature"></div></section>
<section class="library"><div class="section-top"><div><p class="eyebrow">YOUR COLLECTION</p><h2 id="section-title"></h2></div><label class="search"><span>⌕</span><input id="search" type="search" aria-label="Search library / 搜索片单" data-placeholder-zh="找片名、标签或备注…" data-placeholder-en="Search titles, tags or notes…"></label></div><div class="filter-row"><div class="tabs" id="categories"></div><select id="sort" aria-label="Sort / 排序"><option value="new" data-zh="最近收下" data-en="Recently added"></option><option value="title" data-zh="按名称" data-en="By title"></option></select></div><div id="cards" class="cards" aria-live="polite"></div></section>
<section class="source-strip"><div><span>↗</span><h3 data-zh="一个片单，多种来源。" data-en="One library. Your sources."></h3><p data-zh="连接自己的媒体，或让助手帮忙整理。" data-en="Connect your media, or let your assistant help organize it."></p></div><button class="text-button" id="how" data-zh="观看与 Agent 接入说明 ↗" data-en="Playback & agent help ↗"></button></section><footer><span data-zh="蛋蛋影院 · 给想看的内容，一个自己的位置。" data-en="Dandan Cinema · A place for what you want to watch."></span><span>LOCAL FIRST / PREVIEW 0.1</span></footer></main>
<dialog id="editor"><form id="edit-form"><div class="modal-top"><span class="eyebrow">SAVE SOMETHING GOOD</span><button type="button" data-close="editor" class="close" aria-label="Close / 关闭">×</button></div><h2 id="editor-title"></h2><input type="hidden" id="item-id"><label class="field"><span data-zh="片名或标题" data-en="Title"></span><input id="title-input" required maxlength="180"></label><div class="two-fields"><label class="field"><span data-zh="内容类型" data-en="Category"></span><select id="category-input"></select></label><label class="field"><span data-zh="观看状态" data-en="Viewing status"></span><select id="status-input"></select></label></div><label class="field"><span data-zh="简短简介" data-en="Short synopsis"></span><textarea id="synopsis-input" rows="2" maxlength="600"></textarea></label><label class="field"><span data-zh="备注" data-en="Notes"></span><textarea id="note-input" rows="2" maxlength="3000"></textarea></label><label class="field"><span data-zh="标签（用逗号分开）" data-en="Tags (comma separated)"></span><input id="tags-input" maxlength="400"></label><div class="sources-title"><h3 data-zh="观看入口" data-en="Sources"></h3><button type="button" class="text-button" id="add-source" data-zh="＋ 添加入口" data-en="＋ Add source"></button></div><div id="source-fields"></div><p class="field-help" data-zh="平台或网盘填页面链接；视频直链填可播放的媒体地址。本地路径仅记录位置，导入播放请按说明准备。" data-en="Use page links for platforms or cloud storage; direct sources must be media URLs. Local paths are notes until imported using the preparation guide."></p><p id="form-error" class="error" role="alert"></p><div class="modal-actions"><button type="button" data-close="editor" class="button secondary" data-zh="取消" data-en="Cancel"></button><button type="submit" class="button primary" id="save" data-zh="保存到片单 ↗" data-en="Save to library ↗"></button></div></form></dialog>
<dialog id="detail"><div class="modal-top"><span class="eyebrow">TAKE YOUR TIME</span><button data-close="detail" class="close" aria-label="Close / 关闭">×</button></div><div id="detail-content"></div></dialog>
<dialog id="delete-dialog"><div class="modal-top"><span class="eyebrow">MANAGE LIBRARY</span></div><h2 id="delete-title"></h2><p id="delete-summary"></p><div class="modal-actions"><button id="delete-cancel" class="button secondary" data-zh="取消" data-en="Cancel"></button><button id="delete-confirm" class="button primary" data-zh="确认删除" data-en="Confirm deletion"></button></div></dialog>
<dialog id="help"><div class="modal-top"><span class="eyebrow">GETTING STARTED</span><button data-close="help" class="close" aria-label="Close / 关闭">×</button></div><h2 data-zh="你的片单，你的观看方式。" data-en="Your library. Your way to watch."></h2><p data-zh="电视端从同一片单读取内容。电脑需保持开机；首次配对和本地媒体准备步骤见项目的安装指南。" data-en="The TV reads this same library. Keep the computer running; the installation guide explains first-time pairing and local media preparation."></p><p data-zh="MCP 和命令行可让你的助手查询、收藏和更新片单。需要在自己的助手里配置连接，并明确开启写入权限。" data-en="MCP and the CLI let your own assistant search, save and update the library. Configure the connection in your assistant and explicitly enable write tools."></p><p data-zh="使用你有权访问的媒体。平台页面、会员权益、视频直链与已核验本地影片是不同状态。" data-en="Use media you are entitled to access. A platform page, account entitlement, direct media URL and verified local film are different states."></p><a href="https://github.com/Erica1018/dandan-cinema" target="_blank" rel="noopener noreferrer" data-zh="打开项目说明 ↗" data-en="Open project documentation ↗"></a></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
